<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Create stunning portfolios in minutes with AI assistance"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Portfolio Builder | Create Professional Portfolios</title>
    <!-- SPA routing fallback -->
    <script>
      // Handle deep links for SPA
      if (window.location.pathname !== '/' && 
          !window.location.pathname.includes('.') &&
          sessionStorage.getItem('spa-redirect') !== 'true') {
        sessionStorage.setItem('spa-redirect', 'true');
        window.location.replace('/#' + window.location.pathname);
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
